<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agents UI logo</title>
  <desc id="desc">A minimal paper-toned square with a clean A monogram in ink, blue, and teal.</desc>
  <defs>
    <linearGradient id="tile" x1="86" y1="60" x2="426" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff9ec"/>
      <stop offset="0.5" stop-color="#f3e7ca"/>
      <stop offset="1" stop-color="#e5d6b2"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.2" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.48" stop-color="#fff5de" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff5de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentStroke" x1="250" y1="158" x2="332" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a669c"/>
      <stop offset="1" stop-color="#5b908f"/>
    </linearGradient>
    <filter id="tileShadow" x="20" y="24" width="472" height="472" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#261a10" flood-opacity="0.17"/>
    </filter>
    <filter id="markShadow" x="128" y="132" width="256" height="252" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#20150d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="44" y="44" width="424" height="424" rx="104" fill="url(#tile)"/>
    <rect x="44" y="44" width="424" height="424" rx="104" fill="url(#tileGlow)"/>
    <rect x="50" y="50" width="412" height="412" rx="98" fill="none" stroke="#d3c19a" stroke-width="6"/>
  </g>

  <g filter="url(#markShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M182 354 L250 164" stroke="#1e1814" stroke-width="56"/>
    <path d="M330 354 L262 164" stroke="url(#accentStroke)" stroke-width="56"/>

    <path d="M216 272 H296" stroke="#d7c6a1" stroke-width="46"/>
    <path d="M216 272 H296" stroke="#f8f0dd" stroke-width="36"/>
    <path d="M230 272 H282" stroke="#2a669c" stroke-width="12"/>
  </g>
</svg>
