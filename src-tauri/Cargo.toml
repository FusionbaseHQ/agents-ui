[package]
name = "agents-ui"
version = "0.9.0"
description = "Agents UI desktop app"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
keyring = "2.3"
rand_core = "0.6"
portable-pty = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-drag = "2.1.0"
notify = "7"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "std"], default-features = false }
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"], default-features = false }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"], default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Release tuning: thin-LTO + single codegen unit enable cross-crate inlining
# across serde_json/tauri/portable-pty/tokio; strip shrinks the shipped binary.
# NOTE: deliberately NOT setting panic = "abort" — tokio task isolation and the
# agent.rs registration-thread join().unwrap_or(...) recovery rely on unwinding;
# aborting would turn a recoverable per-connection/task panic into a full crash.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
